# WST IFS red channel
# Generated by slicersim.wst.make_wst_config_files from pyetc (data files):
# pyetc/wst.py (Inspired from MUSE throughput, version 0.1 10/02/2023) and pyetc/data/WST tables.

# ============= #
#  Atmosphere   #
# ============= #
[atmosphere]
site = "Paranal"
sky_table = "wst_ifs_red_sky.ecsv"    # ESO SkyCalc (via pyetc): transmission & emission
seeing = 0.8                    # Seeing FWHM [arcsec] at 5000 A and zenith (seeing-induced PSF)
airmass = 1.0                   # Airmass (tabulated: 1.0, 1.2, 1.5, 2.0)
moon = "darksky"                # Sky condition: darksky, greysky, brightsky

# ============= #
#  Telescope    #
# ============= #
[telescope]
diameter_ext = 12.0             # Primary mirror external diameter [m] (seeing model)
diameter_int = 0.0
surface = 82.0                 # Collecting area [m2] = 100.0 m2 x (1 - 0.18 IFS obscuration)
temperature = 0                 # No thermal emission in the optical
emissivity = 0

# ============= #
# Spectrograph  #
# ============= #
[spectrograph]
name = "wst_ifs_red"
spectral_range = [6000, 9600]     # Wavelength domain [A]
dispersion_law = "wst_ifs_red_dispersion.ecsv"  # Linear dispersion: 0.97 A/px
dispersion_resolution = 2.5       # LSF FWHM [px]
dispersion_scale = 0.8            # = 2/dispersion_resolution, keeps 0.97 A/px
spatial_scale = 0.25            # Spaxel size [arcsec]
spatial_shape = [25, 25]        # Simulated sub-field [spaxels] (point sources)
lbda_ref = 5000                 # Reference wavelength [A] (Gaussian fallback PSF)

[spectrograph.throughput]
throughput = "wst_ifs_red_throughput.csv"  # Telescope + instrument + QE (pyetc TOT)

[spectrograph.optics]           # No thermal emission in the optical
temperature = [0]
emissivity = [0]
nelements = [1]
fratio = [[1, 1]]
geometry = ["circular"]
dispersed = [false]

[spectrograph.psf.spatial]
psf_profile = "moffat"          # Seeing-limited Moffat PSF
optical_fwhm = 0.1             # Optical (telescope + instrument) FWHM [arcsec], added in quadrature to the seeing
moffat_beta = 2.5              # Moffat shape parameter
moffat_truncation = 0           # 0: exact Moffat; 2: pyetc truncation (box of ~2 FWHM, renormalized)
psf_sigma_spectral = 0.3        # [arcsec] Gaussian fallback profile only
guiding_sigma = 0.0             # Included in the seeing

# ============= #
#  Detector     #
# ============= #
[detector]
shape = [6144, 6144]
QE = 1.0                        # Included in the throughput
gain = 1.0                      # Gain [ADU/e-]
saturation = 65535              # Saturation limit [ADU]
ron = 3.0                       # Read-out noise per read [e-]
dark = 0.000833333            # Dark current [e-/s/px] = 3.0 e-/h
pixel_size = 15.0               # Pixel physical size [um]
dit = 1800.0                    # Exposure time of a single exposure (DIT) [s]

# ============= #
#  Extraction   #
# ============= #
[extraction]
nramps = 1                      # Number of exposures (NDIT)
aperture_radius = 10            # Point-source extraction aperture radius [spx]
box_hsize = 2                   # Half size of the "box" extraction aperture [spx]
